# QEVA CRM, full stack in one machine (no shared services, no Swarm, no Traefik).
#
# Brings up: PostgreSQL, Redis, MinIO (S3-compatible storage), the Rails app and the Sidekiq worker.
# Values come from a .env file next to this file. See deploy/standalone.env.example and README.md.
#
#   docker compose -f docker-compose.standalone.yaml up -d --build
#
# The app is served on http://localhost:${APP_PORT:-3000}. MinIO console on http://localhost:${MINIO_CONSOLE_PORT:-9001}.

x-app-env: &app-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  INSTALLATION_NAME: ${INSTALLATION_NAME:-QEVA CRM}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
  FORCE_SSL: ${FORCE_SSL:-false}
  ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ACTIVE_STORAGE_SERVICE: amazon
  # Must be reachable from the browser (download links are signed with this host). Use your public MinIO URL.
  AWS_ENDPOINT: ${AWS_ENDPOINT:-http://minio:9000}
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qeva-crm}
  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-QEVA CRM <no-reply@example.com>}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-example.com}
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
  SMTP_OPENSSL_VERIFY_MODE: ${SMTP_OPENSSL_VERIFY_MODE:-peer}
  MAILER_INBOUND_EMAIL_DOMAIN: ${MAILER_INBOUND_EMAIL_DOMAIN:-example.com}
  RAILS_LOG_TO_STDOUT: "true"
  USE_INBOX_AVATAR_FOR_BOT: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-chatwoot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and the app's own MinIO user (least privilege), then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-qeva-crm}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME &&
      mc admin user add local $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY || true &&
      mc admin policy attach local readwrite --user $$AWS_ACCESS_KEY_ID || true"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qeva-crm:local
    restart: unless-stopped
    command: ["sh", "-c", "docker/entrypoints/rails.sh bundle exec rails db:chatwoot_prepare && exec docker/entrypoints/rails.sh bundle exec rails s -p 3000 -b 0.0.0.0"]
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    image: qeva-crm:local
    restart: unless-stopped
    command: ["sh", "-c", "docker/entrypoints/rails.sh bundle exec sidekiq -C config/sidekiq.yml"]
    environment:
      <<: *app-env
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
